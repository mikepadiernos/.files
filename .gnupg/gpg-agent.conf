# Allow passphrase preloading into gpg-agent for all GnuPG consumers.
allow-preset-passphrase

# Use Qt pinentry so KDE desktop integration (including external wallet cache)
# can be used when available.
pinentry-program /usr/bin/pinentry-qt

# Keep cached passphrases available across app usage.
default-cache-ttl 28800
max-cache-ttl 31536000
